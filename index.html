<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyList</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>

   <main class="container">
    <header class="main-header">
        <h1 class="title-buylist">BuyList</h1>
        <h1 class="title-author">Занько Марія</h1>
    </header>

    <div class="content-wrapper">
        <section class="column left-panel">
            
            <div class="add-item-box">
                <label for="new-product-input" class="visually-hidden">Назва товару</label>
                <input type="text" id="new-product-input" placeholder="Введіть назву товару">
                <button class="btn-add" data-tooltip="Додати новий товар до списку">Додати</button>
            </div>

           
            <ul class="products-list"></ul>
        </section>

        <aside class="column right-panel status-panel">
            <h2>Залишилося</h2>
            
            <div class="tags-container remaining-tags"></div>
            
            <h2>Куплено</h2>
            <div class="tags-container bought-tags"></div>
        </aside>
    </div>
</main>

    <div class="author-badge" role="complementary">
        <div class="badge-visible">
            BuyList
        </div>
        <div class="badge-hidden">
            Розробка: Занько марія
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
